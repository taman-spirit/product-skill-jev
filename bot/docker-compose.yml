services:
  pm-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: pm-bot:latest
    container_name: pm-bot
    env_file: ../.env
    volumes:
      - ..:/workspace:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import anthropic; print('ok')"]
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
