services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aipm-backend
    ports:
      - "8000:8000"
    volumes:
      - ../:/workspace:rw
    environment:
      - WORKSPACE_PATH=/workspace
    env_file:
      - ../.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aipm-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://aipm-backend:8000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: aipm-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
